<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>실전 통역 훈련 시스템</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { text-align: center; color: #333; margin-top: 0; }
        select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; }
        button { background-color: #007AFF; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:active { background-color: #0056b3; }
        .scenario-box { background: #eef2f5; padding: 15px; border-radius: 8px; margin: 15px 0; font-size: 18px; font-weight: bold; text-align: center; word-break: keep-all; }
        .feedback-box { background: #fffde7; padding: 15px; border-radius: 8px; border: 1px solid #fff59d; margin-top: 15px; display: none; font-size: 14px; line-height: 1.5; }
        .recording { background-color: #ff3b30 !important; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <h2>실전 통역 훈련</h2>
    
    <select id="scenarioType" onchange="loadScenario()">
        <option value="meeting">첫 만남 및 인사 (아이스브레이킹)</option>
        <option value="welfare">사회복지 시설 및 프로그램 소개</option>
    </select>

    <div class="scenario-box" id="promptText">상황을 선택해주세요.</div>
    
    <button onclick="playAudio()">🔊 상황 듣기</button>
    <button id="micBtn" onclick="startRecognition()">🎤 통역하기 (마이크)</button>

    <div class="feedback-box" id="feedbackArea">
        <strong>내 통역:</strong> <span id="mySpeech"></span><br><br>
        <strong>AI 교정 및 피드백:</strong><br>
        <div id="aiFeedback">평가 중입니다...</div>
    </div>
</div>

<script>
    // ========== 1. API 키 설정 (필수) ==========
    // 구글 AI Studio에서 무료로 발급받은 Gemini API 키를 아래에 넣으세요.
    const API_KEY = '여기에_API_키를_입력하세요'; 

    // ========== 2. 시나리오 데이터 ==========
    const scenarios = {
        meeting: [
            { ko: "먼 길 오시느라 고생 많으셨습니다. 타카스카이 방문단 여러분을 진심으로 환영합니다.", lang: "ko" },
            { ko: "はじめまして。本日はお忙しい中、お時間をいただきありがとうございます。", lang: "ja" },
            { ko: "호텔까지는 전용 차량으로 이동할 예정입니다. 약 40분 정도 소요됩니다.", lang: "ko" }
        ],
        welfare: [
            { ko: "저희는 사회복지법인 미선 산하의 늘품발달장애인평생교육센터입니다.", lang: "ko" },
            { ko: "최근에는 발달장애인 가족을 위한 가족사진관 프로젝트를 성공적으로 마쳤습니다.", lang: "ko" },
            { ko: "日本の発達障害者に対する就労支援の現状について教えていただけますか。", lang: "ja" }
        ]
    };

    let currentPrompt = "";
    let currentTargetLang = ""; // 통역해야 할 언어 (한국어가 나오면 일본어로, 일본어가 나오면 한국어로)

    function loadScenario() {
        const type = document.getElementById('scenarioType').value;
        const list = scenarios[type];
        const randomItem = list[Math.floor(Math.random() * list.length)];
        
        currentPrompt = randomItem.ko;
        currentTargetLang = randomItem.lang === 'ko' ? 'ja-JP' : 'ko-KR';
        
        document.getElementById('promptText').innerText = currentPrompt;
        document.getElementById('feedbackArea').style.display = 'none';
    }

    // ========== 3. 음성 출력 (TTS) ==========
    function playAudio() {
        const utterance = new SpeechSynthesisUtterance(currentPrompt);
        utterance.lang = currentTargetLang === 'ja-JP' ? 'ko-KR' : 'ja-JP'; // 원문 언어
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
    }

    // ========== 4. 음성 인식 (STT) ==========
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.interimResults = false;

    function startRecognition() {
        recognition.lang = currentTargetLang; 
        recognition.start();
        document.getElementById('micBtn').innerText = "듣고 있습니다...";
        document.getElementById('micBtn').classList.add('recording');
    }

    recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        document.getElementById('micBtn').innerText = "🎤 통역하기 (마이크)";
        document.getElementById('micBtn').classList.remove('recording');
        
        document.getElementById('feedbackArea').style.display = 'block';
        document.getElementById('mySpeech').innerText = transcript;
        document.getElementById('aiFeedback').innerText = "AI가 문법과 비즈니스 표현을 검토 중입니다...";
        
        getAiFeedback(currentPrompt, transcript, currentTargetLang);
    };

    recognition.onerror = function() {
        document.getElementById('micBtn').innerText = "🎤 통역하기 (마이크)";
        document.getElementById('micBtn').classList.remove('recording');
        alert("음성 인식에 실패했습니다. 마이크 권한을 확인해주세요.");
    };

    // ========== 5. AI 피드백 연동 ==========
    async function getAiFeedback(original, translated, targetLang) {
        if(API_KEY === '여기에_API_키를_입력하세요') {
            document.getElementById('aiFeedback').innerText = "API 키가 입력되지 않았습니다. 코드에 API 키를 넣어주세요.";
            return;
        }

        const promptMessage = `
        원본 문장: "${original}"
        학생의 통역(${targetLang}): "${translated}"
        위 통역을 평가해주세요. 
        1. 의미가 정확히 전달되었는지
        2. 비즈니스 상황(공식적인 교류)에 맞는 정중한 표현(경어/겸양어 등)이 사용되었는지
        3. 더 자연스러운 모범 통역안 1개 제시
        짧고 명확하게 피드백해주세요.
        `;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptMessage }] }]
                })
            });
            const data = await response.json();
            const feedbackText = data.candidates[0].content.parts[0].text;
            document.getElementById('aiFeedback').innerHTML = feedbackText.replace(/\n/g, '<br>');
        } catch (error) {
            document.getElementById('aiFeedback').innerText = "피드백을 불러오는 데 실패했습니다.";
        }
    }

    // 초기화
    window.onload = loadScenario;
</script>
</body>
</html>
